interface:
  display_name: "Anti-AI Detection Writing Skill"
  short_description: "Polish prose and retailer mail; scan only if asked"
  default_prompt: "Use $anti-ai-detection-writing-skill to make this text smoother and easier to read for its reader. Preserve every supplied fact and qualification, including uncertainty. Never drop a fact, an uncertainty, or a qualification to lower a score. If it is a private retailer or customer-service email, answer the latest question first, use one clear ask and ordinary words, and keep the sign-off I supply. Never replace a sender's name I supply to lower a score. Leave a clear complete draft unchanged unless a bolted-on recap or date sentence should be folded into a sentence already there, or I explicitly ask for a measured alternative that preserves those facts. That fold removed a trigger on one kettle email. It is not a way to pass a detector. Do not invent experience, injury, storage or carrying details, causes, dates, slang, errors, or invisible characters. Run a detector only if I explicitly ask. When a known human-scoring version exists, start from it and change as little as possible. Do not run a whole-text polish over fact-dense text. Before a scan I explicitly request, run scripts/check_facts.py and keep every number, date, price, order ID, and capitalised name. Do not promise a human classification, a lower score, or inbox delivery."
