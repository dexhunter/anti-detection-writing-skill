interface:
  display_name: "Anti-Detection Writing"
  short_description: "Polish retailer emails; scan only if asked"
  default_prompt: "Use $anti-detection-writing to write or polish one short private retailer or customer-service email. Answer the latest question first, keep every supplied fact and qualification, use one clear ask and ordinary words, and keep the sign-off I supply. Leave a clear complete draft unchanged unless I explicitly ask for a measured alternative that preserves those facts. Do not invent experience, injury, storage or carrying details, causes, dates, slang, or errors. Run a detector only if I explicitly ask. Do not promise a human classification, a lower score, or inbox delivery."
